name: JSON demo

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    name: .NET ${{ matrix.dotnet }} / ${{ matrix.arch }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        dotnet: [10, 11]
        arch: [arm64, x64]
        mode: [jit, aot]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-musl-arm64
          - arch: x64
            runner: ubuntu-24.04
            rid: linux-musl-x64
    steps:
      - uses: actions/checkout@v4
      - name: Build and run demo with the local package
        env:
          DOTNET_VERSION: ${{ matrix.dotnet }}
          RID: ${{ matrix.rid }}
          MODE: ${{ matrix.mode }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot \
            dotnet pack src/JsonGenerator/JsonGenerator.csproj -c Release -p:PackageVersion=1.11.2-ci -o /work/.dev-temp/ci/packages --nologo -v:q
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work -e DOTNET_VERSION -e RID -e MODE \
            mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}.0-alpine-aot sh -c '
              set -eu
              mkdir -p .dev-temp/ci/consumer
              printf "%s\n" \
                "<Project Sdk=\"Microsoft.NET.Sdk\">" \
                "  <PropertyGroup>" \
                "    <OutputType>Exe</OutputType>" \
                "    <TargetFramework>net$DOTNET_VERSION.0</TargetFramework>" \
                "    <Nullable>enable</Nullable>" \
                "    <ImplicitUsings>enable</ImplicitUsings>" \
                "    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>" \
                "    <InvariantGlobalization>true</InvariantGlobalization>" \
                "    <StaticExecutable>true</StaticExecutable>" \
                "    <OptimizationPreference>Size</OptimizationPreference>" \
                "    <TreatWarningsAsErrors>true</TreatWarningsAsErrors>" \
                "    <IlcTreatWarningsAsErrors>true</IlcTreatWarningsAsErrors>" \
                "    <JsonSerializerIsReflectionEnabledByDefault Condition=\"&apos;\$(MODE)&apos; == &apos;aot&apos;\">false</JsonSerializerIsReflectionEnabledByDefault>" \
                "  </PropertyGroup>" \
                "  <ItemGroup>" \
                "    <PackageReference Include=\"Neemle.JSON\" Version=\"1.11.2-ci\" Condition=\"&apos;\$(MODE)&apos; == &apos;aot&apos;\" />" \
                "    <Compile Include=\"/work/samples/JsonAotDemo${DOTNET_VERSION#10}/Program.cs\" />" \
                "  </ItemGroup>" \
                "  <ItemGroup><IlcArg Include=\"--reflectiondata:none\" /><LinkerArg Include=\"-Wl,--fatal-warnings\" /></ItemGroup>" \
                "</Project>" > .dev-temp/ci/consumer/Consumer.csproj
              if [ "$MODE" = jit ]; then
                dotnet restore .dev-temp/ci/consumer/Consumer.csproj -r "$RID" -p:PublishAot=false --source /work/.dev-temp/ci/packages --source https://api.nuget.org/v3/index.json
                dotnet build .dev-temp/ci/consumer/Consumer.csproj --no-restore -c Release -r "$RID" \
                  -p:PublishAot=false -o /work/.dev-temp/ci/bin
                if ! timeout -s KILL 180 dotnet /work/.dev-temp/ci/bin/Consumer.dll > /work/.dev-temp/ci/output.txt; then
                  cat /work/.dev-temp/ci/output.txt
                  exit 1
                fi
              else
                dotnet restore .dev-temp/ci/consumer/Consumer.csproj -r "$RID" -p:PublishAot=true --source /work/.dev-temp/ci/packages --source https://api.nuget.org/v3/index.json
                dotnet publish .dev-temp/ci/consumer/Consumer.csproj --no-restore -c Release -r "$RID" \
                  -p:PublishAot=true -o /work/.dev-temp/ci/bin
                response="/work/.dev-temp/obj/.dev-temp/ci/consumer/Consumer/Release/net$DOTNET_VERSION.0/$RID/native/Consumer.ilc.rsp"
                grep -Fxq -- --reflectiondata:none "$response"
                grep -Fxq -- --warnaserror "$response"
                readelf -h /work/.dev-temp/ci/bin/Consumer > /dev/null
                if readelf -l /work/.dev-temp/ci/bin/Consumer | grep -q INTERP || \
                   readelf -d /work/.dev-temp/ci/bin/Consumer | grep -q NEEDED; then
                  echo "The AOT executable is not statically linked." >&2
                  exit 1
                fi
                if ! timeout -s KILL 180 /work/.dev-temp/ci/bin/Consumer > /work/.dev-temp/ci/output.txt; then
                  cat /work/.dev-temp/ci/output.txt
                  exit 1
                fi
              fi
              grep -Fxq JSON_DEMO_PASS /work/.dev-temp/ci/output.txt
            '
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.dotnet }}-${{ matrix.arch }}-${{ matrix.mode }}
          path: .dev-temp/ci/output.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  aspnet:
    name: ASP.NET startup / .NET ${{ matrix.dotnet }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        dotnet: [10, 11]
        arch: [arm64, x64]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-musl-arm64
          - arch: x64
            runner: ubuntu-24.04
            rid: linux-musl-x64
    steps:
      - uses: actions/checkout@v4
      - name: Verify startup and JSON without global metadata restrictions
        env:
          DOTNET_VERSION: ${{ matrix.dotnet }}
          RID: ${{ matrix.rid }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot \
            dotnet build src/JsonGenerator/JsonGenerator.csproj -c Release --nologo -v:q
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work -e DOTNET_VERSION -e RID \
            mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}.0-alpine-aot sh -c '
              set -eu
              mkdir -p .dev-temp/aspnet/tools .dev-temp/aspnet/buildTransitive .dev-temp/aspnet/app .dev-temp/aspnet/lib
              cp .dev-temp/bin/src/JsonGenerator/JsonGenerator/Release/net10.0/JsonGenerator.dll .dev-temp/aspnet/tools/
              cp src/JsonGenerator/JsonRuntime*.patch .dev-temp/aspnet/tools/
              cp src/JsonGenerator/Neemle.JSON.targets .dev-temp/aspnet/buildTransitive/
              printf "%s\n" \
                "<Project Sdk=\"Microsoft.NET.Sdk\">" \
                "<PropertyGroup><TargetFramework>net$DOTNET_VERSION.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><EnableDefaultCompileItems>false</EnableDefaultCompileItems><DefineConstants>LIBRARY</DefineConstants><TreatWarningsAsErrors>true</TreatWarningsAsErrors><JsonSerializerIsReflectionEnabledByDefault>false</JsonSerializerIsReflectionEnabledByDefault></PropertyGroup>" \
                "<ItemGroup><PackageReference Include=\"Neemle.CSharpComposer\" Version=\"0.5.0\" /><Compile Include=\"/work/.github/MultiAssemblyProbe.cs\" /></ItemGroup>" \
                "<Import Project=\"../buildTransitive/Neemle.JSON.targets\" />" \
                "</Project>" > .dev-temp/aspnet/lib/Lib.csproj
              dotnet restore .dev-temp/aspnet/lib/Lib.csproj -p:PublishAot=false
              dotnet build .dev-temp/aspnet/lib/Lib.csproj -c Release -p:PublishAot=false --no-restore -o /work/.dev-temp/aspnet/precompiled
              printf "%s\n" \
                "<Project Sdk=\"Microsoft.NET.Sdk.Web\">" \
                "<PropertyGroup><TargetFramework>net$DOTNET_VERSION.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><EnableDefaultCompileItems>false</EnableDefaultCompileItems><DefineConstants>MULTI_ASSEMBLY</DefineConstants><InvariantGlobalization>true</InvariantGlobalization><StaticExecutable>true</StaticExecutable><TreatWarningsAsErrors>true</TreatWarningsAsErrors><IlcTreatWarningsAsErrors>true</IlcTreatWarningsAsErrors><JsonSerializerIsReflectionEnabledByDefault>false</JsonSerializerIsReflectionEnabledByDefault><EnableRequestDelegateGenerator>true</EnableRequestDelegateGenerator></PropertyGroup>" \
                "<ItemGroup><PackageReference Include=\"Neemle.CSharpComposer\" Version=\"0.5.0\" /><Compile Include=\"/work/.github/AspNetProbe.cs\" /><Reference Include=\"Lib\"><HintPath>../precompiled/Lib.dll</HintPath></Reference></ItemGroup>" \
                "<Import Project=\"../buildTransitive/Neemle.JSON.targets\" />" \
                "</Project>" > .dev-temp/aspnet/app/App.csproj
              dotnet restore .dev-temp/aspnet/app/App.csproj -r "$RID" -p:PublishAot=false
              dotnet build .dev-temp/aspnet/app/App.csproj -c Release -r "$RID" -p:PublishAot=false --no-restore -o /work/.dev-temp/aspnet/jit
              dotnet /work/.dev-temp/aspnet/jit/App.dll > /work/.dev-temp/aspnet/jit.txt
              dotnet restore .dev-temp/aspnet/app/App.csproj -r "$RID" -p:PublishAot=true
              dotnet publish .dev-temp/aspnet/app/App.csproj -c Release -r "$RID" -p:PublishAot=true --no-restore -o /work/.dev-temp/aspnet/aot
              response="/work/.dev-temp/obj/.dev-temp/aspnet/app/App/Release/net$DOTNET_VERSION.0/$RID/native/App.ilc.rsp"
              if grep -Fxq -- --reflectiondata:none "$response"; then exit 1; fi
              grep -Fxq -- --warnaserror "$response"
              timeout -s KILL 180 /work/.dev-temp/aspnet/aot/App > /work/.dev-temp/aspnet/aot.txt
              grep -Fxq ASPNET_STARTUP_PASS /work/.dev-temp/aspnet/aot.txt
              cmp /work/.dev-temp/aspnet/jit.txt /work/.dev-temp/aspnet/aot.txt
            '

  multiple-assemblies:
    name: Multiple assemblies / .NET ${{ matrix.dotnet }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        dotnet: [10, 11]
        arch: [arm64, x64]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-musl-arm64
          - arch: x64
            runner: ubuntu-24.04
            rid: linux-musl-x64
    steps:
      - uses: actions/checkout@v4
      - name: Test both projects with the generator
        env:
          DOTNET_VERSION: ${{ matrix.dotnet }}
          RID: ${{ matrix.rid }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot \
            dotnet build src/JsonGenerator/JsonGenerator.csproj -c Release --nologo -v:q
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work -e DOTNET_VERSION -e RID \
            mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}.0-alpine-aot sh -c '
              set -eu
              mkdir -p .dev-temp/multi/tools .dev-temp/multi/buildTransitive .dev-temp/multi/app .dev-temp/multi/lib
              cp .dev-temp/bin/src/JsonGenerator/JsonGenerator/Release/net10.0/JsonGenerator.dll .dev-temp/multi/tools/
              cp src/JsonGenerator/JsonRuntime*.patch .dev-temp/multi/tools/
              cp src/JsonGenerator/Neemle.JSON.targets .dev-temp/multi/buildTransitive/
              for project in app lib; do
                properties=""
                if [ "$project" = app ]; then properties="<OutputType>Exe</OutputType>"; fi
                if [ "$project" = lib ]; then properties="<DefineConstants>LIBRARY</DefineConstants>"; fi
                reference=""
                if [ "$project" = app ]; then reference="<Reference Include=\"Lib\"><HintPath>../precompiled/Lib.dll</HintPath></Reference>"; fi
                printf "%s\n" \
                  "<Project Sdk=\"Microsoft.NET.Sdk\">" \
                  "<PropertyGroup><TargetFramework>net$DOTNET_VERSION.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><EnableDefaultCompileItems>false</EnableDefaultCompileItems><TreatWarningsAsErrors>true</TreatWarningsAsErrors><IlcTreatWarningsAsErrors>true</IlcTreatWarningsAsErrors><JsonSerializerIsReflectionEnabledByDefault>false</JsonSerializerIsReflectionEnabledByDefault><WarningsNotAsErrors>CS0618</WarningsNotAsErrors><NoWarn>CS1591</NoWarn>$properties</PropertyGroup>" \
                  "<ItemGroup><PackageReference Include=\"Neemle.CSharpComposer\" Version=\"0.5.0\" /><Compile Include=\"/work/.github/MultiAssemblyProbe.cs\" />$reference</ItemGroup>" \
                  "<ItemGroup><IlcArg Include=\"--reflectiondata:none\" /><IlcArg Include=\"--nowarnaserr:IL2026\" /></ItemGroup>" \
                  "<Import Project=\"../buildTransitive/Neemle.JSON.targets\" />" \
                  "</Project>" > ".dev-temp/multi/$project/$(if [ "$project" = app ]; then echo App; else echo Lib; fi).csproj"
              done
              dotnet restore .dev-temp/multi/lib/Lib.csproj -p:PublishAot=false
              dotnet build .dev-temp/multi/lib/Lib.csproj -c Release -p:PublishAot=false --no-restore -o /work/.dev-temp/multi/precompiled
              dotnet restore .dev-temp/multi/app/App.csproj -r "$RID" -p:PublishAot=false
              dotnet build .dev-temp/multi/app/App.csproj -c Release -r "$RID" -p:PublishAot=false --no-restore -o /work/.dev-temp/multi/jit
              dotnet /work/.dev-temp/multi/jit/App.dll > /work/.dev-temp/multi/jit.txt
              dotnet restore .dev-temp/multi/app/App.csproj -r "$RID" -p:PublishAot=true
              dotnet publish .dev-temp/multi/app/App.csproj -c Release -r "$RID" -p:PublishAot=true -p:StaticExecutable=true -p:InvariantGlobalization=true --no-restore -o /work/.dev-temp/multi/aot
              timeout -s KILL 180 /work/.dev-temp/multi/aot/App > /work/.dev-temp/multi/aot.txt
              grep -Fxq MULTI_ASSEMBLY_PASS /work/.dev-temp/multi/aot.txt
              cmp /work/.dev-temp/multi/jit.txt /work/.dev-temp/multi/aot.txt
            '

  compare:
    name: Compare JIT and AOT / .NET ${{ matrix.dotnet }} / ${{ matrix.arch }}
    needs: [demo, multiple-assemblies, aspnet]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: [10, 11]
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: demo-${{ matrix.dotnet }}-${{ matrix.arch }}-jit
          path: jit
      - uses: actions/download-artifact@v4
        with:
          name: demo-${{ matrix.dotnet }}-${{ matrix.arch }}-aot
          path: aot
      - name: Compare complete output
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot \
            dotnet run --file .github/CompareDemo.cs -- jit/output.txt aot/output.txt

  publish:
    name: Release tagged version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: compare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(dotnet msbuild src/JsonGenerator/JsonGenerator.csproj -nologo -getProperty:Version)
          test "$RELEASE_TAG" = "v$version"
      - name: Pack tagged version
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot \
            dotnet pack src/JsonGenerator/JsonGenerator.csproj -c Release -o /work/.dev-temp/release
      - name: Authenticate to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: neemle
      - name: Publish verified package and create release
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package=".dev-temp/release/Neemle.JSON.${RELEASE_TAG#v}.nupkg"
          test -f "$package"
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
          gh release create "$RELEASE_TAG" "$package" --title "Neemle.JSON ${RELEASE_TAG#v}" \
            --notes "Release ${RELEASE_TAG#v}, verified by .NET 10 and .NET 11 JIT and NativeAOT CI."
